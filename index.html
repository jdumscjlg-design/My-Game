<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play the game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Play the game 🎵</h1>

        <div class="card">
            <h2>Neue Karte einordnen</h2>
            <p class="subtitle">Scanne den QR-Code deiner Karte und trage hier das Erscheinungsjahr ein:</p>

            <!-- Eingabeformular -->
            <div class="input-group">
                <label for="year-input">Erscheinungsjahr der neuen Karte:</label>
                <input type="number" id="year-input" placeholder="z. B. 1998" min="1900" max="2026">
            </div>

            <div class="input-group">
                <label for="position-select">Soll die Karte eingeordnet werden zwischen:</label>
                <select id="position-select">
                    <!-- Dynamisch befüllt -->
                </select>
            </div>

            <button id="add-card-btn" class="btn primary">Karte prüfen & einordnen 🚀</button>

            <div id="feedback-msg" class="feedback hidden"></div>
        </div>

        <!-- Der persönliche Zeitstrahl -->
        <div class="card timeline-card">
            <h2>Dein Zeitstrahl (<span id="card-count">1</span> Karten)</h2>
            <div id="timeline" class="timeline">
                <!-- Startkarte ist standardmäßig vorhanden -->
            </div>
            <button id="reset-btn" class="btn secondary">Spiel zurücksetzen</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
